# THE OUTSIDE CHECK: runs on GitHub's schedulers, not Vercel's.
#
# SYNNR's daily job (app/api/cron/daily, 13:30 UTC) sends managers the
# morning email about trucks with no after-the-job photo, checks billing, and
# cleans up demo companies. It logs every run. /api/health answers 200 only
# when the last run is under 26 hours old and finished clean. This workflow
# asks that question from infrastructure Vercel doesn't own, so it also
# catches the site being down or Vercel's scheduler being dead.
#
# When this job fails, GitHub emails the repo owner (the default for failed
# scheduled workflows on your own repo). Check once: github.com -> Settings ->
# Notifications -> Actions -> "Send notifications for failed workflows" is on.
#
# GitHub turns off scheduled workflows on a repo with no pushes for 60 days,
# and emails a warning first.

name: alert-pipeline-heartbeat

on:
  schedule:
    # Twice a day: 14:00 UTC catches this morning's 13:30 run missing;
    # 02:00 UTC catches a site that died overnight.
    - cron: "0 14 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch: {} # manual "test the pinger" button in the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Daily job ran and the site is up
        run: |
          set -euo pipefail
          # Retry transient blips so a single 502 doesn't page anyone;
          # a real outage fails all three attempts.
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 \
              https://www.synnr.io/api/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt $i: HTTP $code — $(cat /tmp/health.json 2>/dev/null || echo 'no body')"
            sleep 30
          done
          echo "::error::SYNNR's daily job hasn't run clean in over a day, or www.synnr.io is down. Managers may not be getting the morning email. Check the Vercel cron for /api/cron/daily and the saas_cron_runs table."
          exit 1
