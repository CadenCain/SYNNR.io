    <path transform="translate(64 310) scale(0.5)" d="M10 3H30L28.2 9H12L25.4 18L22 29H2L3.8 23H20L6.6 14Z" fill="#ff5a1f"/>
    <path transform="translate(120 304) scale(0.875)" d="M10 3H30L28.2 9H12L25.4 18L22 29H2L3.8 23H20L6.6 14Z" fill="#ededef"/>
    <text x="160" y="323" fill="#71757d" font-size="13">also works in white</text>
  </g>

