    <g transform="translate(0 44) scale(4)"><path transform="translate(1.2 1.2) scale(0.925)" d="M10 3H30L28.2 9H12L25.4 18L22 29H2L3.8 23H20L6.6 14Z" fill="#ff5a1f" stroke="#ff5a1f" stroke-width="2.2" stroke-linejoin="round"/></g>
    <g transform="translate(0 216) scale(1.25)"><path transform="translate(1.2 1.2) scale(0.925)" d="M10 3H30L28.2 9H12L25.4 18L22 29H2L3.8 23H20L6.6 14Z" fill="#ff5a1f" stroke="#ff5a1f" stroke-width="2.2" stroke-linejoin="round"/></g>
    <text x="56" y="249" fill="#ededef" font-size="34" font-weight="600" letter-spacing="6">SYNNR</text>
