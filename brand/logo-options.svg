    <g transform="translate(8 304) scale(0.875)"><path transform="translate(1.2 1.2) scale(0.925)" d="M10 3H30L28.2 9H12L25.4 18L22 29H2L3.8 23H20L6.6 14Z" fill="#ff5a1f" stroke="#ff5a1f" stroke-width="2.2" stroke-linejoin="round"/></g>
    <g transform="translate(64 310) scale(0.5)"><path transform="translate(1.2 1.2) scale(0.925)" d="M10 3H30L28.2 9H12L25.4 18L22 29H2L3.8 23H20L6.6 14Z" fill="#ff5a1f" stroke="#ff5a1f" stroke-width="2.2" stroke-linejoin="round"/></g>
